                  tunnels:
                  - interface: tun1
                    addresses:
                    - protocol: ipv4
                      address: 6.2.6.7
                notes: This cluster is for New York Office
                url: https://n123.meraki.com/networkName/n/abc123/manage/campus_gateways/clusters
      summary: Create a cluster and add campus gateways to it
      tags:
      - campusGateway
