                          description: Name of the interface
                        vlan:
                          type: integer
                          description: VLAN of the interface
                        addresses:
                          type: array
                          items:
                            type: object
                            properties:
                              assignmentMode:
                                type: string
                                description: Assignment mode of the interface
                              protocol:
                                type: string
                                description: Protocol of the interface
                              gateway:
                                type: string
                                description: Gateway of the interface
                              subnetMask:
                                type: string
                                description: Subnet mask of the interface
                          description: Addresses of the interface
                    description: Uplink settings of the cluster
                  tunnels:
                    type: array
                    items:
                      type: object
                      properties:
                        uplink:
                          type: object
                          properties:
                            interface:
                              type: string
                              description: Uplink interface name
                          description: Use uplink interface as tunnel interface
                        interface:
                          type: string
                          description: Name of the interface
                        vlan:
                          type: integer
                          description: VLAN ID of the interface
                        addresses:
                          type: array
                          items:
                            type: object
                            properties:
                              protocol:
                                type: string
                                description: Protocol of the interface
                              gateway:
                                type: string
                                description: Gateway of the interface
                              subnetMask:
                                type: string
                                description: Subnet mask of the interface
                          description: Addresses of the interface
                    description: Tunnel settings of the cluster
                  nameservers:
                    type: object
                    properties:
                      addresses:
                        type: array
                        items:
                          type: string
                        description: Addresses of the nameservers
                    description: Nameservers of the cluster
                  portChannels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID of the port channel
                        name:
                          type: string
                          description: Name of the port channel
                        vlan:
                          type: integer
                          description: VLAN ID of the port channel
                        allowedVlans:
                          type: string
                          description: Allowed VLANs of the port channel
                    description: Port channel settings of the cluster
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        serial:
                          type: string
                          description: Serial of the device
                        memberId:
                          type: string
                          description: Member number assigned to the device within cluster - This is a read only attribute and cannot be altered using post/put operations
                        uplinks:
                          type: array
                          items:
                            type: object
                            properties:
                              interface:
                                type: string
                                description: Uplink interface name
                              addresses:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    protocol:
                                      type: string
                                      description: Protocol of the interface
                                    address:
                                      type: string
                                      description: IP address of the interface
                                description: Uplink IP addresses of the device
                          description: Uplink settings of the device
                        tunnels:
                          type: array
                          items:
                            type: object
                            properties:
                              interface:
                                type: string
                                description: Tunnel interface name
                              addresses:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    protocol:
                                      type: string
                                      description: Protocol of the interface
                                    address:
                                      type: string
                                      description: IP address of the interface
                                description: Tunnel IP addresses of the device
                          description: Tunnel settings of the device
                    description: Devices in the cluster
                  notes:
                    type: string
                    description: Notes about cluster
                  url:
                    type: string
                    description: URL to display cluster details
              example:
                clusterId: '1284392014818'
                name: North Campus
                uplinks:
                - interface: man1
                  vlan: 5
                  addresses:
                  - assignmentMode: static
                    protocol: ipv4
                    gateway: 1.2.3.5
                    subnetMask: 255.255.255.0
                tunnels:
                - uplink:
                    interface: man1
                  interface: tun1
                  vlan: 6
                  addresses:
                  - protocol: ipv4
                    gateway: 2.3.5.6
                    subnetMask: 255.255.255.0
                nameservers:
                  addresses:
                  - 8.8.8.8
                  - 8.8.4.4
                portChannels:
                - id: '1284392014830'
                  name: Port-channel1
