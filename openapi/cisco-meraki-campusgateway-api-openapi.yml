  /organizations/{organizationId}/campusGateway/connections/overview:
    get:
      description: List the count of connections(APs) with tunneling status up and down through the Campus Gateway clusters
      operationId: getOrganizationCampusGatewayConnectionsOverview
      parameters:
      - name: organizationId
        in: path
        description: Organization ID
        schema:
          type: string
        required: true
      - name: networkIds
        in: query
        description: Optional parameter to filter networks. This filter uses multiple exact matches.
        schema:
          type: array
          items:
            type: string
      - name: serials
        in: query
        description: Optional parameter to filter connections(APs) by its own serials. This filter uses multiple exact matches.
        schema:
          type: array
          items:
            type: string
      - name: campusGatewaySerials
        in: query
        description: Optional parameter to filter connections(APs) by Campus Gateway serials. This filter uses multiple exact matches.
        schema:
          type: array
          items:
            type: string
      - name: campusGatewayClusterIds
        in: query
        description: Optional parameter to filter connections(APs) by Campus Gateway cluster IDs. This filter uses multiple exact matches.
        schema:
          type: array
          items:
            type: string
      - name: campusGatewayTunnelStatuses
        in: query
        description: Optional parameter to filter connections(APs) by tunnel statuses. This filter uses multiple exact matches.
        schema:
          type: array
          items:
            type: string
      - name: search
        in: query
        description: Optional setting that lets you filter access points (APs) by name, serial number, MAC address, network name, or interface IP address. The filter matches partial text, not just exact values (uses ILIKE matching).
        schema:
          type: string
      - name: models
        in: query
        description: Optional parameter to filter connections(APs) by device model names. This filter uses multiple exact matches.
        schema:
          type: array
          items:
            type: string
      - name: dataEncryptionStatuses
        in: query
        description: Optional parameter to filter connections(APs) by data encryption status. This filter uses multiple exact matches.
        schema:
          type: array
          items:
            type: string
            enum:
            - down
            - up
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    properties:
                      byTunnelStatus:
                        type: object
                        properties:
                          up:
                            type: integer
                            description: Connections with tunnelling status up
                          down:
                            type: integer
                            description: Connections with tunnelling status down
                        required:
                        - up
                        - down
                        description: Connections counts by tunnel status
                      total:
                        type: integer
                        description: Total connections
                    required:
                    - byTunnelStatus
                    - total
                    description: Connections counts
                required:
                - counts
              example:
                counts:
                  byTunnelStatus:
                    up: 10
                    down: 20
                  total: 30
      summary: List the count of connections(APs) with tunneling status up and down through the Campus Gateway clusters
      tags:
      - campusGateway
