      - name: originId
        in: path
        description: The origin ID of the network device.
        required: true
        schema:
          type: integer
          minimum: 1
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              description: Update the network device information.
              properties:
                name:
                  type: string
                  example: label1
                  maxLength: 50
                  minLength: 1
                  description: 'The name of the device. The name is a sequence of characters with a length from 1 through 50.

