  /organizations/{organizationId}/networkDevices:
    post:
      tags:
      - Deployments
      summary: Create Network Device
      description: Create a network device.
      operationId: createNetworkDevice
      security:
      - meraki_api_key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 4
              required:
              - model
              - macAddress
              - name
              - serialNumber
              properties:
                model:
                  type: string
                  example: ModelName
                  maxLength: 128
                  pattern: '[0-9A-Za-z_.-]{1,128}'
                  description: The model name of the device. Must be unique to your organization.
                macAddress:
                  type: string
                  example: 0123456789ab
                  maxLength: 12
                  minLength: 12
                  pattern: '[0-9A-Fa-f]{12}'
                  description: 'The MAC address of the device. The unique MAC address may include

                    up to 12 characters and must not contain hyphens or colons.'
                name:
                  type: string
                  example: label1
                  maxLength: 50
                  minLength: 1
                  description: 'The name of the device. The name is a sequence of characters with a length from 1 through 50.

                    The name must be unique in your organization.'
                serialNumber:
                  type: string
                  example: 12345a
                  maxLength: 255
                  description: The serial number of the device.
                tag:
                  type: string
                  description: A text tag that describes the device or this origin, which is assigned to the device. Provide a tag that is unique to your organization.
                  maxLength: 50
            example:
              model: The model name of the device.
              macAddress: 0123456789ab
              name: A name for the device.
              serialNumber: 12345a
      responses:
        '201':
          description: Created
          headers:
            Content-Type:
              schema:
                type: string
              description: The MIME content type of the response body.
              example: application/json
            Date:
              schema:
                type: string
                pattern: ^[0-90-90-90-9-0-90-9-0-90-9T0-90-9:0-90-9:0-90-9Z]+$
              description: The timestamp of the response.
              example: '2023-03-14T18:34:25Z'
          content:
            application/json:
              schema:
                type: object
                description: The network device object.
                minProperties: 7
                required:
                - originId
                - deviceId
                - deviceKey
                - name
                - serialNumber
                - createdAt
                - organizationId
                properties:
                  originId:
                    type: integer
                    example: 35872943
                    minimum: 1
                    description: 'The unique global identifier for this traffic source (origin). Use

                      the origin ID to manage the device. The origin ID is not used by the device.'
                  deviceId:
                    type: string
                    example: 0123456789abcdef
                    maxLength: 16
                    minLength: 15
                    description: The unique identifier for the specific network device. Insert the identifier into the EDNS packets.
                  deviceKey:
                    type: string
                    example: ModelName-0123456789ab
                    description: 'A descriptive unique identifier for the device. Not used by the

                      device.'
                  name:
                    type: string
                    example: APIDemoDevice
                    description: The name of the device.
                    minLength: 1
                  serialNumber:
                    type: string
                    example: 12345a
                    description: The serial number of the device.
                  createdAt:
                    type: string
                    format: date-time
                    example: '2017-09-22T04:18:51.000Z'
                    description: The time when the device was created. Specify an ISO 8601-formatted timestamp.
                  organizationId:
                    type: integer
                    description: The ID of the organization.
                    example: 1234
                    minimum: 1
              example:
                originId: 35872943
                deviceId: 0123456789abcdef
                deviceKey: ModelName-0123456789ab
                name: APIDemoDevice
                serialNumber: 12345a
                createdAt: '2021-09-22T04:18:51.000Z'
                organizationId: 1234
        '400':
          description: Bad Request
          headers:
            Content-Type:
              schema:
                type: string
              description: The MIME content type of the response body.
              example: application/json
            Date:
              schema:
                type: string
                pattern: ^[0-90-90-90-9-0-90-9-0-90-9T0-90-9:0-90-9:0-90-9Z]+$
              description: The timestamp of the response.
              example: '2023-03-14T18:34:25Z'
          content:
            application/json:
              schema:
                type: object
                properties:
                  Error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                description: The information about the error condition.
                properties:
                  message:
                    type: string
                    description: The message associated with the error condition.
                  error:
                    type: string
                    description: The status code for the error condition.
              example:
                message: Unauthorized request
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                description: The information about the error condition.
                properties:
                  message:
                    type: string
                    description: The message associated with the error condition.
                  error:
                    type: string
                    description: The status code for the error condition.
              example:
                message: Forbidden
        '404':
          description: Not Found
          headers:
            Content-Type:
              schema:
                type: string
              description: The MIME content type of the response body.
              example: application/json
            Date:
              schema:
                type: string
                pattern: ^[0-90-90-90-9-0-90-9-0-90-9T0-90-9:0-90-9:0-90-9Z]+$
              description: The timestamp of the response.
              example: '2023-03-14T18:34:25Z'
          content:
            application/json:
              schema:
                type: object
                properties:
                  Error:
                    type: string
        '500':
          description: Internal Server Error
          headers:
            Content-Type:
              schema:
                type: string
              description: The MIME content type of the response body.
              example: application/json
            Date:
              schema:
                type: string
                pattern: ^[0-90-90-90-9-0-90-9-0-90-9T0-90-9:0-90-9:0-90-9Z]+$
              description: The timestamp of the response.
              example: '2023-03-14T18:34:25Z'
          content:
            application/json:
              schema:
                type: object
                properties:
                  Error:
                    type: string
      parameters:
      - name: organizationId
        in: path
        description: Organization ID associated with this resource.
        required: true
        schema:
          type: integer
