  /organizations/{organizationId}/tunnels:
    get:
      summary: List Tunnels
      operationId: listTunnels
      description: List the tunnels for an organization.
      security:
      - meraki_api_key: []
      tags:
      - Deployments
      parameters:
      - name: organizationId
        in: path
        description: Organization ID associated with this resource.
        required: true
        schema:
          type: integer
      - in: query
        name: includeState
        schema:
          default: false
          type: boolean
        description: Specify whether to include the tunnel state information in the response.
        required: false
      - in: query
        name: limit
        description: The number of items to return in the collection. If not set, all tunnels are returned.
        required: false
        schema:
          type: integer
      - in: query
        name: startKey
        description: 'Specify where to start reading in the tunnel collection (`startKey` correlates to the first tunnel to return).

          If the `startKey` query parameter is not included in the API request, Umbrella reads the collection from the first available tunnel.

          When the API request includes the `limit` query parameter and you have more tunnels to read,

          Umbrella returns the value of `startKey` for the next tunnel in the hypermedia Link header.'
        required: false
        schema:
          type: string
      - in: query
        name: filters
        description: "Filters the tunnel list by tunnel name, device type, service type, status, data center, or site origin ID.\nFor example:\n```\n{\n  \"name\": \"test\",\n  \"deviceType\": \"ISR\",\n  \"serviceType\": \"SIG\",\n  \"status\": \"UP\",\n  \"dataCenter\": \"pao1.edc\",\n  \"siteOriginId\": 123\n}\n```"
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OKs
          headers:
            Content-Type:
              schema:
                type: string
              description: The MIME content type of the response body.
              example: application/json
            Date:
              schema:
                type: string
                pattern: ^[0-90-90-90-9-0-90-9-0-90-9T0-90-9:0-90-9:0-90-9Z]+$
              description: The timestamp of the response.
              example: '2023-03-14T18:34:25Z'
            Total-Item-Count:
              schema:
                type: string
              description: The total number of active, inactive, and unestablished tunnels in the organization.
              example: '500'
            Total-Distinct-DC-Count:
              schema:
                type: string
              description: The number of distinct data centers in the organization.
              example: '2'
            Total-Active-Item-Count:
              schema:
                type: string
              description: The total number of active tunnels in the organization.
              example: '5'
            Total-Inactive-Item-Count:
              schema:
                type: string
              description: The total number of inactive tunnels in the organization.
              example: '10'
            Link:
              schema:
                type: string
              description: 'The hypermedia links are formatted as a string. Use to provide parameters for pagination.

                Only available if request limits the number of tunnels returned.

                The link is a relative path. The `rel` value is always `next` (pagination moves forward).'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: 'Get the information about the tunnel in the organization.

                    To include the tunnel state information in the response, set the `includeState` request query parameter to `true`.'
                  properties:
                    id:
                      type: integer
                      readOnly: true
                      description: The tunnel resource ID. Use this ID as a reference for subsequent requests.
                      example: 1122321
                    uri:
                      type: string
                      description: Resource URI
                      readOnly: true
                      example: /organization/2345432/tunnels/1122321
                    name:
                      type: string
                      description: 'The display name of the tunnel. The tunnel name is required, cannot exceed 50 characters in length,

                        and cannot have any special characters other than spaces and hyphens.'
                      example: Site01Tunnel
                    siteOriginId:
                      type: integer
                      description: Site Origin ID to associate with the tunnel
                      example: 123456
                    client:
                      type: object
                      description: The tunnel client's configuration metadata.
                      properties:
                        deviceType:
                          type: string
