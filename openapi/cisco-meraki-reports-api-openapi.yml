          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: The total number of requests.
                    properties:
                      count:
                        type: integer
                        format: int32
                        description: The total number of API requests.
                        example: 450
                    required:
                    - count
                    example:
                      count: 42
                  meta:
                    type: object
                    description: The properties of the metadata.
                    example: {}
                required:
                - data
                - meta
              example:
                data:
                  count: 42
                meta: {}
        '400':
          description: Bad Request
          headers:
            Content-Type:
              schema:
                type: string
              description: The MIME content type of the response body.
              example: application/json
            Date:
              schema:
                type: string
                pattern: ^[0-90-90-90-9-0-90-9-0-90-9T0-90-9:0-90-9:0-90-9Z]+$
              description: The timestamp of the response.
              example: '2023-03-14T18:34:25Z'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The description of the error.
                    example: Internal Server Error
                  code:
                    type: integer
                    description: The status code of the error.
                    example: 500
                example:
                  message: Bad Request
                  code: 400
