  /organizations/{organizationId}/reports/appDiscovery/applications:
    get:
      tags:
      - Reports
      summary: List Applications
      description: List all discovered applications.
      operationId: getApplicationsAppDiscovery
      parameters:
      - name: organizationId
        in: path
        description: Organization ID associated with this resource.
        required: true
        schema:
          type: integer
      - in: query
        name: sources
        schema:
          type: array
          items:
            type: string
            enum:
            - dns
            - swg
            - cdfw
        style: form
        explode: false
        description: 'Specify the types of log source to filter the collection.

          Valid values are: `dns`, `swg`, `cdfw`.'
        example:
        - cdfw
      - in: query
        name: identity
        schema:
          type: integer
        description: Specify the entity ID to filter the collection.
        example: 12355
      - in: query
        name: labels
        schema:
          type: array
          items:
            type: string
            description: 'The application label. Valid values are: `unreviewed`, `approved`, `notApproved`, `underAudit`.'
            enum:
            - unreviewed
            - approved
            - notApproved
            - underAudit
            example: approved
        style: form
        explode: false
        description: 'Specify the types of application classification to filter the collection.

          Valid values are: `unreviewed`, `approved`, `notApproved`, `underAudit`.'
        example:
        - approved
      - in: query
        name: controllable
        schema:
          type: string
          enum:
          - all
          - advanced
        description: 'Specify the type of controllable applications to filter the collection.

          Valid values are: `all`, `advanced`.'
        example: advanced
      - in: query
        name: weightedRisk
        schema:
          type: array
          items:
            type: string
            description: The risk the app poses to the environment.
            enum:
            - veryLow
            - low
            - medium
            - high
            - veryHigh
            example: low
        style: form
        explode: false
        description: 'Specify the list of application weighted risk to filter the collection.

          Valid values are: `veryLow`, `low`, `medium`, `high`, `veryHigh`.'
        example:
        - low
      - in: query
        name: categories
        schema:
          type: array
          items:
            type: string
        style: form
