  /organizations/{organizationId}/sensor/gateways/connections/latest:
    get:
      description: Returns latest sensor-gateway connectivity data.
      operationId: getOrganizationSensorGatewaysConnectionsLatest
      parameters:
      - name: organizationId
        in: path
        description: Organization ID
        schema:
          type: string
        required: true
      - name: sensorSerials
        in: query
        description: List of sensor serials to filter connectivity data by sensor.
        schema:
          type: array
          items:
            type: string
      - name: perPage
        in: query
        description: The number of entries per page returned. Acceptable range is 3 - 1000. Default is 1000.
        schema:
          type: integer
      - name: startingAfter
        in: query
        description: A token used by the server to indicate the start of the page. Often this is a timestamp or an ID but it is not limited to those. This parameter should not be defined by client applications. The link for the first, last, prev, or next page in the HTTP Link header should define it.
        schema:
          type: string
      - name: endingBefore
        in: query
        description: A token used by the server to indicate the end of the page. Often this is a timestamp or an ID but it is not limited to those. This parameter should not be defined by client applications. The link for the first, last, prev, or next page in the HTTP Link header should define it.
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        lastReportedAt:
                          type: string
                          format: date-time
                          description: Time, in ISO8601 format, when RSSI was last reported for the sensor and gateway pair.
                        lastConnectedAt:
                          type: string
                          format: date-time
                          description: Time, in ISO8601 format, when the sensor and gateway pair last connected.
                        rssi:
                          type: integer
                          description: Last reported RSSI value.
                        network:
                          type: object
                          properties:
                            name:
                              type: string
                              description: The name of the network.
                            id:
                              type: string
                              description: The id of the network.
                          required:
                          - name
                          - id
                          description: Information about the network that the sensor and gateway are in.
                        sensor:
                          type: object
                          properties:
                            serial:
                              type: string
                              description: The serial number of the sensor.
                            name:
                              type: string
                              description: The name of the sensor.
                            mac:
                              type: string
                              description: The MAC address of the sensor.
                          required:
                          - name
                          - mac
                          description: Information about the sensor.
                        gateway:
                          type: object
                          properties:
                            serial:
                              type: string
                              description: The serial number of the gateway.
                            name:
                              type: string
                              description: The name of the gateway.
                            mac:
                              type: string
                              description: The MAC address of the gateway.
                          required:
                          - name
                          - mac
                          description: Information about the gateway.
                      required:
                      - lastReportedAt
                      - rssi
                      - network
                      - sensor
                      - gateway
                    description: The organization's RSSI information between sensor-gateway pairs.
                  meta:
                    type: object
                    properties:
                      counts:
                        type: object
                        properties:
                          items:
                            type: object
                            properties:
                              total:
                                type: integer
                                description: The total number of sensor-gateway pairs with reported RSSI data.
                              remaining:
                                type: integer
                                description: The number of sensor-gateway pairs with reported RSSI data that are available on subsequent pages
                            description: The count metadata.
                        description: Count metadata related to this result set.
                    description: Other metadata related to this result set.
                required:
                - items
              example:
                items:
                - lastReportedAt: '2024-09-04T19:29:05Z'
                  lastConnectedAt: '2024-09-04T19:29:05Z'
                  rssi: -24
                  network:
                    name: My sensor
                    id: N_12345678
                  sensor:
                    serial: Q234-ABCD-0001
                    name: My sensor
                    mac: 00:11:22:33:44:55
                  gateway:
                    serial: Q234-ABCD-0004
                    name: My gateway
                    mac: 22:33:44:55:66:77
                meta:
                  counts:
                    items:
                      total: 20
                      remaining: 0
          headers:
            Link:
              schema:
                type: string
              description: A comma-separated list of first, last, prev, and next relative links used for subsequent paginated requests.
      summary: Returns latest sensor-gateway connectivity data.
      tags:
      - sensor
