  /networks/{networkId}/switch/stacks/{switchStackId}/routing/staticRoutes:
    get:
      description: List layer 3 static routes for a switch stack
      operationId: getNetworkSwitchStackRoutingStaticRoutes
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      - name: switchStackId
        in: path
        description: Switch stack ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    staticRouteId:
                      type: string
                      description: The identifier of a layer 3 static route
                    name:
                      type: string
                      description: The name or description of the layer 3 static route
                    subnet:
                      type: string
                      description: The IP address of the subnetwork specified in CIDR notation (ex. 1.2.3.0/24)
                    nextHopIp:
                      type: string
                      description: The IP address of the router to which traffic for this destination network should be sent
                    managementNextHop:
                      type: string
                      description: Optional fallback IP address for management traffic
                    vrf:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name of the VRF this static route belongs to
                        leakRouteToDefaultVrf:
                          type: boolean
                          description: Whether or not next-hop IP is reachable via default VRF
                      description: VRF settings. Included on networks with IOS XE 17.18 or higher
                    advertiseViaOspfEnabled:
                      type: boolean
                      description: Option to advertise static routes via OSPF
                    preferOverOspfRoutesEnabled:
                      type: boolean
                      description: Option to prefer static routes over OSPF routes
                  required:
                  - staticRouteId
                  - subnet
                  - nextHopIp
              example:
              - staticRouteId: '1234'
                name: My route
                subnet: 192.168.1.0/24
                nextHopIp: 1.2.3.4
                managementNextHop: 1.2.3.5
                vrf:
                  name: Blue
                  leakRouteToDefaultVrf: false
                advertiseViaOspfEnabled: false
                preferOverOspfRoutesEnabled: false
      security:
      - oauth2:
        - switch:config:read
      summary: List layer 3 static routes for a switch stack
      tags:
      - switch
    post:
      description: Create a layer 3 static route for a switch stack
      operationId: createNetworkSwitchStackRoutingStaticRoute
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      - name: switchStackId
        in: path
        description: Switch stack ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name or description for layer 3 static route
                subnet:
                  type: string
                  description: The subnet which is routed via this static route and should be specified in CIDR notation (ex. 1.2.3.0/24)
                nextHopIp:
                  type: string
                  description: IP address of the next hop device to which the device sends its traffic for the subnet
                advertiseViaOspfEnabled:
                  type: boolean
                  description: Option to advertise static route via OSPF
                preferOverOspfRoutesEnabled:
                  type: boolean
                  description: Option to prefer static route over OSPF routes
                vrf:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the VRF this static route belongs to
                    leakRouteToDefaultVrf:
                      type: boolean
                      description: Whether or not next-hop IP is reachable via default VRF
                  description: The VRF settings of the interface. Requires IOS XE 17.18 or higher
              example:
                name: My route
                subnet: 192.168.1.0/24
                nextHopIp: 1.2.3.4
                advertiseViaOspfEnabled: false
                preferOverOspfRoutesEnabled: false
                vrf:
                  name: Blue
                  leakRouteToDefaultVrf: false
              required:
              - subnet
              - nextHopIp
        required: true
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  staticRouteId:
                    type: string
                    description: The identifier of a layer 3 static route
                  name:
                    type: string
                    description: The name or description of the layer 3 static route
                  subnet:
                    type: string
                    description: The IP address of the subnetwork specified in CIDR notation (ex. 1.2.3.0/24)
                  nextHopIp:
                    type: string
                    description: The IP address of the router to which traffic for this destination network should be sent
                  managementNextHop:
                    type: string
                    description: Optional fallback IP address for management traffic
                  vrf:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name of the VRF this static route belongs to
                      leakRouteToDefaultVrf:
                        type: boolean
                        description: Whether or not next-hop IP is reachable via default VRF
                    description: VRF settings. Included on networks with IOS XE 17.18 or higher
                  advertiseViaOspfEnabled:
                    type: boolean
                    description: Option to advertise static routes via OSPF
                  preferOverOspfRoutesEnabled:
                    type: boolean
                    description: Option to prefer static routes over OSPF routes
                required:
                - staticRouteId
                - subnet
                - nextHopIp
              example:
                staticRouteId: '1234'
                name: My route
                subnet: 192.168.1.0/24
                nextHopIp: 1.2.3.4
                managementNextHop: 1.2.3.5
                vrf:
                  name: Blue
                  leakRouteToDefaultVrf: false
                advertiseViaOspfEnabled: false
                preferOverOspfRoutesEnabled: false
      security:
      - oauth2:
        - switch:config:write
      summary: Create a layer 3 static route for a switch stack
      tags:
      - switch
