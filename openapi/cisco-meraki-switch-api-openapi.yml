          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      type: object
                      properties:
                        comment:
                          type: string
                          description: Description of the rule (optional)
                        policy:
                          type: string
                          enum:
                          - allow
                          - deny
                          description: '''allow'' or ''deny'' traffic specified by this rule'
                        ipVersion:
                          type: string
                          enum:
                          - any
                          - ipv4
                          - ipv6
                          description: IP address version
                        protocol:
                          type: string
                          enum:
                          - any
                          - tcp
                          - udp
                          description: The type of protocol
