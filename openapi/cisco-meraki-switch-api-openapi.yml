                    headerLength: 1
                    protocol: 1
                    ttl: 50
                    dscp:
                      tag: 24
                      ecn: 1
                  udp:
                    length: 24929
                    checksum: '0x1414'
                  fields:
                    op: 1
                    htype: 1
                    hlen: 6
                    hops: 0
                    xid: '0x11111111'
                    secs: 1526087474
                    flags: '0x0000'
                    ciaddr: 1.2.3.4
                    yiaddr: 123.123.123.1
                    siaddr: 1.2.3.4
                    giaddr: 1.2.3.5
                    chaddr: abcdefghijkl
                    sname: 1.2.3.4
                    magicCookie: '0x22222222'
                    options:
                    - name: Lease time
