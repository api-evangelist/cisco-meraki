  /devices/{serial}/switch/routing/interfaces:
    get:
      description: List layer 3 interfaces for a switch. Those for a stack may be found under switch stack routing.
      operationId: getDeviceSwitchRoutingInterfaces
      parameters:
      - name: serial
        in: path
        description: Serial
        schema:
          type: string
        required: true
      - name: mode
        in: query
        description: Optional parameter to filter L3 interfaces by mode.
        schema:
          type: string
          enum:
          - loopback
          - oob_management
          - routed
          - vlan
      - name: protocol
        in: query
        description: Optional parameter to filter L3 interfaces by protocol.
        schema:
          type: string
          enum:
          - ipv4
          - ipv6
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    interfaceId:
                      type: string
                      description: The ID
                    name:
                      type: string
                      description: The name
                    mode:
                      type: string
                      enum:
                      - loopback
                      - oob_management
                      - routed
                      - vlan
                      description: The mode
                    subnet:
                      type: string
                      description: IPv4 subnet
                    interfaceIp:
                      type: string
                      description: IPv4 address
                    mtu:
                      type: integer
                      description: Interface MTU
                    serial:
                      type: string
                      description: Device serial
                    switchPortId:
                      type: string
                      description: Switch Port ID when in Routed mode
                    multicastRouting:
                      type: string
                      description: Multicast routing status
                    vlanId:
                      type: integer
                      description: VLAN ID
                    uplinkV4:
                      type: boolean
                      description: When true, this interface is used as static IPv4 uplink
                    uplinkV6:
                      type: boolean
                      description: When true, this interface is used as static IPv6 uplink
                    ospfSettings:
                      type: object
                      properties:
                        area:
                          type: string
                          description: Area ID
                        cost:
                          type: integer
                          description: OSPF Cost
                        isPassiveEnabled:
                          type: boolean
                          description: Disable sending Hello packets on this interface's IPv4 area
                        networkType:
                          type: string
                          enum:
                          - broadcast
                          - point-to-point
                          description: OSPF network type
                      description: IPv4 OSPF Settings
                    ospfV3:
                      type: object
                      properties:
                        area:
                          type: string
                          description: Area ID
                        cost:
                          type: integer
                          description: OSPF Cost
                        isPassiveEnabled:
                          type: boolean
                          description: Disable sending Hello packets on this interface's IPv6 area
                        networkType:
                          type: string
                          enum:
                          - broadcast
                          - point-to-point
                          description: OSPFv3 network type
                      description: IPv6 OSPF Settings
                    ipv6:
                      type: object
                      properties:
                        assignmentMode:
                          type: string
                          description: Assignment mode
                        address:
                          type: string
                          description: IPv6 address
                        prefix:
                          type: string
                          description: IPv6 subnet
                        gateway:
                          type: string
                          description: IPv6 gateway
                      description: IPv6 addressing
                    vrf:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name of the VRF this interface belongs to
                      description: VRF settings. Included on networks with IOS XE 17.18 or higher
                    loopback:
                      type: object
                      description: Loopback Interface settings
                    defaultGateway:
                      type: string
                      description: IPv4 default gateway
              example:
              - interfaceId: '1234'
                name: L3 interface
                mode: vlan
                subnet: 192.168.1.0/24
                interfaceIp: 192.168.1.2
                mtu: 1500
                serial: Q234-ABCD-5678
                switchPortId: '1'
                multicastRouting: disabled
                vlanId: 100
                uplinkV4: false
                uplinkV6: false
                ospfSettings:
                  area: '0'
                  cost: 1
                  isPassiveEnabled: true
                  networkType: broadcast
                ospfV3:
                  area: '1'
                  cost: 2
                  isPassiveEnabled: true
                  networkType: broadcast
                ipv6:
                  assignmentMode: static
                  address: 2001:db8::1
                  prefix: 2001:db8::/32
                  gateway: 2001:db8::2
                vrf:
                  name: Blue
                defaultGateway: 192.168.1.1
      security:
      - oauth2:
        - switch:config:read
      summary: List layer 3 interfaces for a switch
      tags:
      - switch
    post:
      description: Create a layer 3 interface for a switch
      operationId: createDeviceSwitchRoutingInterface
      parameters:
      - name: serial
        in: path
        description: Serial
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: A friendly name or description for the interface or VLAN (max length 128 characters).
                mode:
                  type: string
                  enum:
                  - loopback
                  - oob_management
                  - routed
                  - vlan
                  description: 'L3 Interface mode, can be one of ''vlan'', ''routed'', ''loopback''. Default is ''vlan''. CS 17.18 or higher is required for ''routed'' mode. '
                subnet:
                  type:
                  - string
                  - 'null'
                  description: The network that this L3 interface is on, in CIDR notation (ex. 10.1.1.0/24).
                switchPortId:
                  type:
                  - string
                  - 'null'
                  description: Switch Port ID when in Routed mode (CS 17.18 or higher required)
                interfaceIp:
                  type:
                  - string
                  - 'null'
                  description: The IP address that will be used for Layer 3 routing on this VLAN or subnet. This cannot be the same         as the device management IP.
                mtu:
                  type:
                  - integer
                  - 'null'
                  description: The interface MTU. Applies to native switch layer 3 interfaces, including VLAN and routed modes.
                multicastRouting:
                  type: string
                  enum:
                  - IGMP snooping querier
