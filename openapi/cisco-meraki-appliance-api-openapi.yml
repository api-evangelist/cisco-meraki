                  properties:
                    enabled:
                      type: boolean
                      description: Whether 802.11w is enabled or not.
                    required:
                      type: boolean
                      description: (Optional) Whether 802.11w is required or not.
                  description: The current setting for Protected Management Frames (802.11w).
              example:
                name: My SSID
                enabled: true
                defaultVlanId: 1
                authMode: 8021x-radius
                psk: psk
                radiusServers:
                - host: 0.0.0.0
                  port: 1000
                  secret: secret
                encryptionMode: wpa
                wpaEncryptionMode: WPA2 only
                visible: true
                dhcpEnforcedDeauthentication:
                  enabled: true
                dot11w:
                  enabled: true
                  required: true
        required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  number:
                    type: integer
                    description: The number of the SSID.
