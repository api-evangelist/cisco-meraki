  /networks/{networkId}/appliance/ports:
    get:
      description: List per-port VLAN settings for all ports of a secure router or security appliance.
      operationId: getNetworkAppliancePorts
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    number:
                      type: integer
                      description: Number of the port
                    enabled:
                      type: boolean
                      description: The status of the port
                    type:
                      type: string
                      description: 'The type of the port: ''access'' or ''trunk''.'
                    dropUntaggedTraffic:
                      type: boolean
                      description: Whether the trunk port can drop all untagged traffic.
                    vlan:
                      type: integer
                      description: Native VLAN when the port is in Trunk mode. Access VLAN when the port is in Access mode.
                    allowedVlans:
                      type: string
                      description: Comma-delimited list of VLAN IDs and/or ranges (for example, '2-10,15'), or 'all' to permit all VLANs on the port.
                    accessPolicy:
                      type: string
                      description: The name of the policy. Only applicable to Access ports.
                    sgt:
                      type: object
                      properties:
                        id:
                          type:
                          - integer
                          - 'null'
                          description: Adaptive policy group ID this port is assigned to.
                        enabled:
                          type: boolean
                          description: Whether or not Peer SGT is enabled for traffic through this port.
                      description: Security Group Tag settings for the port.
              example:
              - number: 1
                enabled: true
                type: access
                dropUntaggedTraffic: false
                vlan: 3
                allowedVlans: all
                accessPolicy: open
                sgt:
                  id: 1234
                  enabled: true
      security:
      - oauth2:
        - sdwan:config:read
