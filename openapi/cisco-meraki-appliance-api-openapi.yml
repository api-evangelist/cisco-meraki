                        filterIn:
                          type: array
                          items:
                            type: string
                          description: Filters routes received from an eBGP neighbor. Each entry must be an IPv4 CIDR string (e.g., '10.0.0.0/8' or '10.0.0.5/32').
                        communityOut:
                          type: array
                          items:
                            type: string
                          description: List of BGP communities tagged to the routes advertised to an eBGP neighbor.
                    description: List of eBGP neighbor configurations
              example:
