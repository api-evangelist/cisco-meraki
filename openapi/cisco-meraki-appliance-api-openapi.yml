                              subslot:
                                type:
                                - integer
                                - 'null'
                                description: Optional subslot number for this interface, if applicable.
                              number:
                                type: integer
                                description: Leaf interface number for this interface
                              byType:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - CRC errors
                                      - broadcast
                                      - broadcast unicast multicast
                                      - collisions
                                      - fragments
                                      - jabbers
                                      - multicast
                                      - oversize
                                      - undersize
                                      - unicast
