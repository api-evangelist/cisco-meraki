  /organizations/{organizationId}/appliance/vpn/thirdPartyVPNPeers:
    get:
      description: Return the third party VPN peers for an organization
      operationId: getOrganizationApplianceVpnThirdPartyVPNPeers
      parameters:
      - name: organizationId
        in: path
        description: Organization ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  peers:
                    type: array
                    items:
                      type: object
                      properties:
                        peerId:
                          type: string
                          description: The ID of the IPsec peer
                        name:
                          type: string
                          description: The name of the VPN peer
                        publicIp:
                          type: string
                          description: '[optional] The public IP of the VPN peer'
                        remoteId:
                          type: string
                          description: '[optional] The remote ID is used to identify the connecting VPN peer. This can either be a valid IPv4 Address, FQDN or User FQDN.'
                        localId:
                          type: string
                          description: '[optional] The local ID is used to identify the MX to the peer. This will apply to all MXs this peer applies to.'
                        secret:
                          type: string
                          description: The shared secret with the VPN peer
                        privateSubnets:
                          type: array
                          items:
                            type: string
                          description: The list of the private subnets of the VPN peer
                        ipsecPolicies:
                          type: object
                          properties:
                            ikeCipherAlgo:
                              type: array
                              items:
                                type: string
                                enum:
                                - aes128
                                - aes192
                                - aes256
                                - des
                                - tripledes
                              description: 'This is the cipher algorithm to be used in Phase 1. The value should be an array with one of the following algorithms: ''aes256'', ''aes192'', ''aes128'', ''tripledes'', ''des'''
                            ikeAuthAlgo:
                              type: array
                              items:
                                type: string
                                enum:
                                - md5
                                - sha1
                                - sha256
                              description: 'This is the authentication algorithm to be used in Phase 1. The value should be an array with one of the following algorithms: ''sha256'', ''sha1'', ''md5'''
                            ikePrfAlgo:
                              type: array
                              items:
                                type: string
                                enum:
                                - default
                                - prfmd5
                                - prfsha1
                                - prfsha256
                              description: '[optional] This is the pseudo-random function to be used in IKE_SA. The value should be an array with one of the following algorithms: ''prfsha256'', ''prfsha1'', ''prfmd5'', ''default''. The ''default'' option can be used to default to the Authentication algorithm.'
                            ikeDiffieHellmanGroup:
                              type: array
                              items:
                                type: string
                              description: 'This is the Diffie-Hellman group to be used in Phase 1. The value should be an array with one of the following algorithms: ''group14'', ''group5'', ''group2'', ''group1'''
                            ikeLifetime:
                              type: integer
                              description: The lifetime of the Phase 1 SA in seconds.
                            childCipherAlgo:
                              type: array
                              items:
                                type: string
                                enum:
                                - aes128
                                - aes192
                                - aes256
                                - des
                                - 'null'
                                - tripledes
                              description: 'This is the cipher algorithms to be used in Phase 2. The value should be an array with one or more of the following algorithms: ''aes256'', ''aes192'', ''aes128'', ''tripledes'', ''des'', ''null'''
                            childAuthAlgo:
                              type: array
                              items:
                                type: string
                                enum:
                                - md5
                                - sha1
                                - sha256
                              description: 'This is the authentication algorithms to be used in Phase 2. The value should be an array with one of the following algorithms: ''sha256'', ''sha1'', ''md5'''
                            childPfsGroup:
                              type: array
                              items:
                                type: string
                              description: 'This is the Diffie-Hellman group to be used for Perfect Forward Secrecy in Phase 2. The value should be an array with one of the following values: ''disabled'',''group14'', ''group5'', ''group2'', ''group1'''
                            childLifetime:
                              type: integer
                              description: The lifetime of the Phase 2 SA in seconds.
                          description: Custom IPSec policies for the VPN peer. If not included and a preset has not been chosen, the default preset for IPSec policies will be used.
                        slaPolicy:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the SLA policy
                          description: '[optional] Information about the SLA policy to be applied to the peer'
                        ipsecPoliciesPreset:
                          type: string
                          description: 'One of the following available presets: ''default'', ''aws'', ''azure'', ''umbrella'', ''umbrella_short_lived'', ''secure'', ''zscaler''. If this is provided, the ''ipsecPolicies'' parameter is ignored. Note that ''umbrella_short_lived'' maps to the Dashboard UI label ''Umbrella'', while ''umbrella'' maps to the Dashboard UI label ''Umbrella (Deprecated)''.'
                        ikeVersion:
                          type: string
                          enum:
                          - '1'
                          - '2'
                          description: '[optional] The IKE version to be used for the IPsec VPN peer configuration. Defaults to ''1'' when omitted.'
                          default: '1'
                        networkTags:
                          type: array
                          items:
                            type: string
                          description: A list of network tags that will connect with this peer. Use ['all'] for all networks. Use ['none'] for no networks. If not included, the default is ['all'].
                        network:
                          type: object
                          properties:
                            names:
                              type: array
                              items:
                                type: string
                              description: '[optional] A list of network Names. Supported only for MX 19.1 and above. The order of items matches the order of IDs.'
                            ids:
                              type: array
                              items:
                                type: string
                              description: '[optional] A list of network IDs.'
                          description: '[optional] A list of network Names and IDs that will connect with this peer. Supported only for MX 19.1 and above.'
                        isRouteBased:
                          type: boolean
                          description: '[optional] If true, the VPN peer is route-based. If not included, the default is false. Supported only for MX 19.1 and above.'
                        ebgpNeighbor:
                          type: object
                          properties:
                            neighborId:
                              type: integer
                              description: ID of ebgp neighbor
                            neighborIp:
                              type: string
                              description: IPv4/IPv6 address of the neighbor
                            ipVersion:
                              type: integer
                              enum:
                              - 4
                              - 6
                              description: The IP version of the neighbor
                            remoteAsNumber:
                              type: integer
                              description: Remote ASN of the neighbor. The remote ASN must be an integer between 1 and 4294967295.
                            ebgpHoldTimer:
                              type: integer
                              description: The eBGP hold timer in seconds for each neighbor. The eBGP hold timer must be an integer between 12 and 240.
                            ebgpMultihop:
                              type: integer
                              description: Configure this if the neighbor is not adjacent. The eBGP multi-hop must be an integer between 1 and 255.
                            sourceIp:
                              type: string
                              description: Source IP of eBGP neighbor
                            receiveLimit:
                              type: integer
                              description: Maximum number of prefixes accepted from the remote peer. Must be an integer between 0 and 2147483647. Supported only for MX 26.2 and above
                            pathPrepend:
                              type: array
                              items:
                                type: integer
                              description: Prepends the AS_PATH BGP Attribute associated with routes received from the remote peer. Configurable value of ASNs to prepend. Length of the array may not exceed 10, and each ASN in the array must be an integer between 1 and 4294967295. AS_PATH is 4th in the decision tree when identical routes from multiple peers exist.
                            multiExitDiscriminator:
                              type: integer
                              description: Configures the local metric associated with routes received from the remote peer. Routes from peers with lower metrics are will be preferred. Must be an integer between 0 and 4294967295. MED is 6th in the decision tree when identical routes from multiple peers exist.
                            weight:
                              type: integer
                              description: Configures the local metric associated with routes received from the remote peer. Routes from peers with lower metrics are will be preferred. Must be an integer between 0 and 4294967295. MED is 6th in the decision tree when identical routes from multiple peers exist.
                          description: '[optional] The BGP neighbor configuration for the VPN peer. Supported only for MX 19.1 and above.'
                        ecmpUplinkConfigs:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: ID of the ECMP uplink configuration
                              wan:
                                type: string
                                enum:
                                - WAN 1
                                - WAN 2
                                - WAN 3
                                - WAN 4
                                description: The WAN uplink associated with this ECMP configuration.
                              privateSubnets:
                                type: array
                                items:
                                  type: string
                                description: The private subnets associated with this ECMP uplink configuration.
                              ebgpNeighbor:
                                type: object
                                properties:
                                  neighborIp:
                                    type: string
                                    description: IPv4/IPv6 address of the neighbor
                                  sourceIp:
                                    type: string
                                    description: Source IP of eBGP neighbor
                                description: '[optional] The eBGP neighbor configuration associated with this ECMP uplink configuration.'
                          description: '[optional] The ECMP per-uplink BGP-over-IPsec configuration for the VPN peer.'
                        priorityInGroup:
                          type: integer
                          description: '[optional] Represents the order of peer inside a group.'
                        group:
                          type: object
                          properties:
                            number:
                              type: integer
                              description: '[optional] Represents the ordering of primary and backup tunnels group. primary and backup tunnels are grouped by this number. Peers containing same group number belongs to same group.'
                            failover:
                              type: object
                              properties:
                                directToInternet:
                                  type: boolean
                                  description: '[optional] When both primary and backup tunnels are down, direct traffic to the internet. Traffic will be routed via the WAN'
                              description: '[optional] Contains the failover configuration for the group.'
                            activeActiveTunnel:
                              type: boolean
                              description: '[optional] Both primary and backup tunnels are active.'
                          description: '[optional] Contains the mapping between primary tunnel and backup tunnels.'
                    description: The list of VPN peers
              example:
                peers:
                - peerId: '1234'
                  name: Peer Name
                  publicIp: 123.123.123.1
                  remoteId: miles@meraki.com
                  localId: myMXId@meraki.com
                  secret: secret
                  privateSubnets:
                  - 192.168.1.0/24
                  - 192.168.128.0/24
                  ipsecPolicies:
                    ikeCipherAlgo:
                    - tripledes
                    ikeAuthAlgo:
                    - sha1
                    ikePrfAlgo:
                    - prfsha1
                    ikeDiffieHellmanGroup:
                    - group2
                    ikeLifetime: 28800
                    childCipherAlgo:
                    - aes128
                    childAuthAlgo:
                    - sha1
                    childPfsGroup:
                    - disabled
                    childLifetime: 28800
                  slaPolicy:
                    id: '1234'
                  ipsecPoliciesPreset: default
                  ikeVersion: '1'
                  networkTags:
                  - all
                  network:
                    names:
                    - Network 1
                    - Location 2
                    - Network 3
                    ids:
                    - N_1
                    - L_2
                    - N_3
                  isRouteBased: true
                  ebgpNeighbor:
                    neighborId: 1234
                    neighborIp: 10.10.10.22
                    ipVersion: 4
                    remoteAsNumber: 64343
                    ebgpHoldTimer: 180
                    ebgpMultihop: 2
                    sourceIp: 10.10.10.22
                    receiveLimit: 100
                    pathPrepend:
                    - 1
                    - 2
                    multiExitDiscriminator: 1
                    weight: 10
                  ecmpUplinkConfigs:
                  - id: '7890'
                    wan: WAN 1
                    privateSubnets:
                    - 169.254.10.0/30
                    ebgpNeighbor:
                      neighborIp: 169.254.10.2
                      sourceIp: 169.254.10.1
                  priorityInGroup: 1
                  group:
                    number: 1
                    failover:
                      directToInternet: true
                    activeActiveTunnel: true
      security:
      - oauth2:
        - sdwan:config:read
      summary: Return the third party VPN peers for an organization
      tags:
      - appliance
    put:
      description: 'Update the third party VPN peers for an organization.


        Subnet overlap warning: Unlike the Dashboard UI, updateOrganizationApplianceVpnThirdPartyVPNPeers does not run the org-wide subnet-overlap validation before saving changes. Requests with overlapping VPN subnets will succeed through the API, but the resulting configuration may be blocked from further edits in Dashboard until the overlaps are resolved manually. Use this endpoint only when you''ve already confirmed the advertised subnets are unique across the organization.

        '
      operationId: updateOrganizationApplianceVpnThirdPartyVPNPeers
      parameters:
      - name: organizationId
        in: path
        description: Organization ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                peers:
                  type: array
                  items:
                    type: object
                    properties:
                      peerId:
                        type: string
