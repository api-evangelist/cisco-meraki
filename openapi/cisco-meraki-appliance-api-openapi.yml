        in: path
        description: Network ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - detection
                    - disabled
                    - prevention
                    description: Intrusion detection mode
                  idsRulesets:
                    type: string
                    description: Intrusion detection ruleset
                  protectedNetworks:
                    type: object
                    properties:
                      useDefault:
                        type: boolean
                        description: 'Whether special IPv4 addresses should be used (see: https://tools.ietf.org/html/rfc5735)'
                      includedCidr:
                        type: array
                        items:
                          type: string
                        description: List of IP addresses or subnets being protected
                      excludedCidr:
                        type: array
                        items:
                          type: string
                        description: List of IP addresses or subnets being excluded from protection
                    description: Networks included in and excluded from the detection engine
              example:
                mode: prevention
                idsRulesets: balanced
                protectedNetworks:
                  useDefault: false
                  includedCidr:
                  - 10.0.0.0/8
                  - 127.0.0.0/8
                  - 169.254.0.0/16
                  - 172.16.0.0/12
                  excludedCidr:
                  - 10.0.0.0/8
                  - 127.0.0.0/8
