                              type: string
                              description: Password to configure MD5 authentication between BGP peers
                          description: Authentication settings between BGP peers
                        multiExitDiscriminator:
                          type: integer
                          description: Multi-exit Discriminator (MED) metric associated with routes received from the neighbor
                        pathPrepend:
                          type: array
                          items:
                            type: integer
                          description: Values to prepend to the AS_PATH BGP Attribute associated with routes received from the neighbor
                        weight:
                          type: integer
                          description: Local weight for routes received from the neighbor
                        filterIn:
                          type: array
                          items:
                            type: string
                          description: Filters routes received from an eBGP neighbor. Each entry must be an IPv4 CIDR string (e.g., '10.0.0.0/8' or '10.0.0.5/32').
                        communityOut:
                          type: array
                          items:
