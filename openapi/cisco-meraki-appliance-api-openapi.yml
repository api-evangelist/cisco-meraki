                          type: string
                          enum:
                          - any
                          - dns
                          - icmp
                          - tcp
                          - udp
                          description: Protocol.
                        destination:
                          type: string
                          description: Destination address; hostname required for DNS, IPv4 otherwise.
                        port:
                          type: string
                          description: Destination port.
                      required:
                      - protocol
                      - destination
                      - port
                    description: Custom VPN exclusion rules.
                  majorApplications:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Application's Meraki ID.
                        name:
                          type: string
                          enum:
                          - AWS
                          - Box
                          - Office 365 Sharepoint
                          - Office 365 Suite
                          - Oracle
                          - SAP
                          - Salesforce
                          - Skype & Teams
                          - Slack
                          - Webex
                          - Webex Calling
                          - Webex Meetings
                          - Zoom
                          description: Application's name.
                      required:
                      - id
                      - name
                    description: Major Application based VPN exclusion rules.
                required:
                - networkId
                - networkName
                - custom
                - majorApplications
              example:
                networkId: N_24329156
                networkName: Main Office
                custom:
                - protocol: tcp
                  destination: 192.168.3.0/24
                  port: '8000'
                majorApplications:
                - id: meraki:vpnExclusion/application/2
