                                receiverUplink:
                                  type: string
                                  description: Receiver uplink interface
                                avgLatencyMs:
                                  type: integer
                                  description: Average latency in milliseconds
                                minLatencyMs:
                                  type: integer
                                  description: Minimum latency in milliseconds
                                maxLatencyMs:
                                  type: integer
                                  description: Maximum latency in milliseconds
                            description: List of latency summaries
                          lossPercentageSummaries:
                            type: array
                            items:
                              type: object
                              properties:
                                senderUplink:
                                  type: string
                                  description: Sender uplink interface
                                receiverUplink:
                                  type: string
                                  description: Receiver uplink interface
                                avgLossPercentage:
                                  type: number
                                  format: float
                                  description: Average loss percentage
                                minLossPercentage:
                                  type: number
                                  format: float
                                  description: Minimum loss percentage
                                maxLossPercentage:
                                  type: number
                                  format: float
                                  description: Maximum loss percentage
                            description: List of loss percentage summaries
                          jitterSummaries:
                            type: array
                            items:
                              type: object
                              properties:
                                senderUplink:
                                  type: string
                                  description: Sender uplink interface
                                receiverUplink:
                                  type: string
                                  description: Receiver uplink interface
                                avgJitter:
                                  type: number
                                  format: float
                                  description: Average jitter
                                minJitter:
                                  type: number
                                  format: float
                                  description: Minimum jitter
                                maxJitter:
                                  type: number
                                  format: float
                                  description: Maximum jitter
                            description: List of jitter summaries
                          mosSummaries:
                            type: array
                            items:
                              type: object
                              properties:
                                senderUplink:
                                  type: string
                                  description: Sender uplink interface
                                receiverUplink:
                                  type: string
                                  description: Receiver uplink interface
                                avgMos:
                                  type: number
                                  format: float
                                  description: Average MOS (Mean opinion score)
                                minMos:
                                  type: number
                                  format: float
                                  description: Minimum MOS (Mean opinion score
                                maxMos:
                                  type: number
                                  format: float
                                  description: Maximum MOS (Mean opinion score
                            description: List of MOS (Mean opinion score) summaries
                      description: List of VPN peers with their summaries
              example:
