                        - Oracle
                        - SAP
                        - Salesforce
                        - Skype & Teams
                        - Slack
                        - Webex
                        - Webex Calling
                        - Webex Meetings
                        - Zoom
                        description: Application's name.
                    required:
                    - id
                  description: Major Application based VPN exclusion rules. Pass an empty array to clear existing rules.
              example:
                custom:
                - protocol: tcp
