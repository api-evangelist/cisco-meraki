                                  - independent
                                  - internet
                                  description: Type of the origin
                                interfaces:
                                  type: array
                                  items:
                                    type: string
                                  description: Interfaces associated with the prefix
                              description: The origin of the prefix
                        description: Prefix assignments on the VLAN
                    description: IPv6 configuration on the VLAN
                  vrf:
                    type: object
                    properties:
                      id:
