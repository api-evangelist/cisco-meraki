                        ipv6:
                          type: object
                          properties:
                            address:
                              type: string
                              description: The IPv6 address of the neighbor
                          description: Information regarding IPv6 address of the neighbor
                        remoteAsNumber:
                          type: integer
                          description: Remote AS number of the neighbor
                        receiveLimit:
                          type: integer
                          description: The maximum number of routes that the appliance can receive from the neighbor
                        allowTransit:
                          type: boolean
