                      type: object
                      properties:
                        network:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The network ID
                          description: Information about the network the device belongs to
                        serial:
                          type: string
                          description: Unique serial number for the device
                        interfaces:
                          type: array
                          items:
                            type: object
                            properties:
