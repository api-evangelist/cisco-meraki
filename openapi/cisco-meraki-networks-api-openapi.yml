  /networks/{networkId}/floorPlans/autoLocate/jobs/batch:
    post:
      description: Schedule auto locate jobs for one or more floor plans in a network
      operationId: batchNetworkFloorPlansAutoLocateJobs
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jobs:
                  type: array
                  items:
                    type: object
                    properties:
                      floorPlanId:
                        type: string
                        description: The ID of the floor plan to run auto locate for
                      refresh:
                        type: array
                        items:
                          type: string
                        description: The types of location data that should be refreshed for this job. The list must either contain both 'gnss' and 'ranging' or be empty, as we currently only support refreshing both 'gnss' and 'ranging', or neither.
                      scheduledAt:
                        type: string
                        format: date-time
                        description: Timestamp in ISO8601 format which indicates when the auto locate job should be run. If omitted, the auto locate job will start immediately.
                    required:
                    - floorPlanId
                  description: The list of auto locate jobs to be scheduled. Up to 100 jobs can be provided in a request.
              example:
                jobs:
                - floorPlanId: g_2176982374
                  refresh:
                  - gnss
                  - ranging
                  scheduledAt: '2018-02-11T00:00:00Z'
              required:
              - jobs
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Auto locate job ID
                        networkId:
                          type: string
                          description: Network ID
                        floorPlanId:
                          type: string
                          description: Floor plan ID
                        status:
                          type: string
                          description: 'Auto locate job status. Possible values: ''scheduled'', ''in progress'', ''canceling'', ''error'', ''finished'', ''published'', ''canceled'''
                        scheduledAt:
                          type: string
                          format: date-time
                          description: Scheduled start time for auto locate job
                        completed:
                          type: object
                          properties:
                            percentage:
                              type: integer
                              description: Approximate auto locate job completion percentage
                          description: Auto locate job progress information
                        ranging:
                          type: object
                          properties:
                            status:
                              type: string
                              description: 'Ranging status. Possible values: ''scheduled'', ''in progress'', ''error'', ''finished'', ''no neighbors'''
                            completed:
                              type: object
                              properties:
                                percentage:
                                  type: integer
                                  description: Completion percentage of the ranging process
                              description: Progress information for the ranging process
                          description: Ranging status and progress information
                        gnss:
                          type: object
                          properties:
                            status:
                              type: string
                              description: 'GNSS status. Possible values: ''scheduled'', ''in progress'', ''error'', ''finished'', ''not applicable'', ''canceled'''
                            completed:
                              type: object
                              properties:
                                percentage:
                                  type: integer
                                  description: Completion percentage of the GNSS acquisition process
                              description: Progress information for the GNSS acquisition process
                          description: GNSS (e.g. GPS) status and progress information
                        errors:
                          type: array
                          items:
                            type: object
                            properties:
                              source:
                                type: string
                                description: 'The step of the auto locate process when the error occurred. Possible values: ''gnss'', ''ranging'', ''positioning'''
                              type:
                                type: string
                                description: 'The type of error that occurred. Possible values: ''failure'', ''no neighbors'', ''missing anchors'', ''wrong anchors'', ''missing ranging data'', ''calculation failure'', ''scheduling failure'''
                          description: List of errors that occurred during a failed run of auto locate
                    description: The newly created jobs
              example:
                jobs:
                - id: '1234'
                  networkId: N_24329156
                  floorPlanId: g_2176982374
                  status: error
                  scheduledAt: '2018-02-11T00:00:00Z'
                  completed:
                    percentage: 50
                  ranging:
                    status: in progress
                    completed:
                      percentage: 24
                  gnss:
                    status: in progress
                    completed:
                      percentage: 4
                  errors:
                  - source: ranging
                    type: missing anchors
      security:
      - oauth2:
        - wireless:config:write
      summary: Schedule auto locate jobs for one or more floor plans in a network
      tags:
      - networks
  /networks/{networkId}/floorPlans/autoLocate/jobs/{jobId}/cancel:
