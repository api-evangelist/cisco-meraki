  /networks/{networkId}/floorPlans/autoLocate/jobs/{jobId}/publish:
    post:
      description: Update the status of a finished auto locate job to be published, and update device locations
      operationId: publishNetworkFloorPlansAutoLocateJob
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      - name: jobId
        in: path
        description: Job ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                devices:
                  type: array
                  items:
                    type: object
                    properties:
                      serial:
                        type: string
                        description: Serial for device to publish position for
                      lat:
                        type: number
                        format: float
                        minimum: -90
                        maximum: 90
                        description: Latitude
                      lng:
                        type: number
                        format: float
                        minimum: -180
                        maximum: 180
                        description: Longitude
                      autoLocate:
                        type: object
                        properties:
                          isAnchor:
                            type: boolean
                            description: Whether or not this device's location should be saved as a user-defined anchor
                        description: The auto locate position for this device
                    required:
                    - serial
                    - lat
                    - lng
                  description: The list of devices to publish positions for
              example:
                devices:
                - serial: Q234-ABCD-5678
                  lat: 37.4180951010362
                  lng: -122.098531723022
                  autoLocate:
                    isAnchor: true
        required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Status of attempt to publish auto locate job
              example:
                success: true
      security:
      - oauth2:
        - wireless:config:write
      summary: Update the status of a finished auto locate job to be published, and update device locations
      tags:
      - networks
  /networks/{networkId}/floorPlans/autoLocate/jobs/{jobId}/recalculate:
    post:
      description: Trigger auto locate recalculation for a job, and optionally set anchors
      operationId: recalculateNetworkFloorPlansAutoLocateJob
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      - name: jobId
        in: path
        description: Job ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                devices:
                  type: array
                  items:
                    type: object
                    properties:
                      serial:
                        type: string
                        description: Serial for device to update
                      autoLocate:
                        type: object
                        properties:
                          isAnchor:
                            type: boolean
                            description: Whether or not this location should be saved as a user-defined anchor
                          lat:
                            type: number
                            format: float
                            minimum: -90
                            maximum: 90
                            description: Latitude
                          lng:
                            type: number
                            format: float
                            minimum: -180
                            maximum: 180
                            description: Longitude
                        required:
                        - isAnchor
                        description: The auto locate position for this device
                    required:
                    - serial
                    - autoLocate
                  description: The list of devices to update anchor positions for
              example:
                devices:
                - serial: Q234-ABCD-5678
                  autoLocate:
                    isAnchor: true
                    lat: 37.4180951010362
                    lng: -122.098531723022
        required: false
      responses:
