  /networks/{networkId}/devices/claim:
    post:
      description: 'Claim devices into a network. (Note: for recently claimed devices, it may take a few minutes for API requests against that device to succeed). This operation can be used up to ten times within a single five minute window.'
      operationId: claimNetworkDevices
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      - name: addAtomically
        in: query
        description: Whether to claim devices atomically. If true, all devices will be claimed or none will be claimed. Default is true.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                serials:
                  type: array
                  items:
                    type: string
                  description: A list of serials of devices to claim
                detailsByDevice:
                  type: array
                  items:
                    type: object
                    properties:
                      serial:
                        type: string
                        description: The serial of the device these details relate to
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Name of device detail
                            value:
                              type: string
                              description: Value of device detail
                          required:
                          - name
                        description: "An array of details. Supported list\n        of details includes: \"device mode\", \"username\", \"password\", \"enable password\", \"ap mapping type\" and\n        \"ap network id\". For onboarding into hybrid mode, the value of the device mode detail must be \"monitored\""
                    required:
                    - serial
                    - details
                  x-release-stage: general_availability
                  description: Optional details for claimed devices (currently only used for Catalyst devices)
              example:
                serials:
                - Q234-ABCD-0001
                - Q234-ABCD-0002
                - Q234-ABCD-0003
                detailsByDevice:
                - serial: Q234-ABCD-5678
                  details:
                  - name: username
                    value: milesmeraki
                addAtomically: true
              required:
              - serials
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  serials:
                    type: array
                    items:
                      type: string
                    description: The serials of the devices
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        serial:
                          type: string
                          description: The serial of the device
                        errors:
                          type: array
                          items:
                            type: string
                          description: The errors for the device
                      required:
                      - serial
                      - errors
                    description: Errors for devices that were not added
              example:
                serials:
                - Q234-ABCD-0001
                - Q234-ABCD-0002
                - Q234-ABCD-0003
                errors:
                - serial: Q234-ABCD-5678
                  errors:
                  - Device already claimed
      security:
      - oauth2:
        - dashboard:licensing:config:write
      summary: 'Claim devices into a network. (Note: for recently claimed devices, it may take a few minutes for API requests against that device to succeed)'
      tags:
      - networks
