        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  defaultDestinations:
                    type: object
                    properties:
                      emails:
                        type: array
                        items:
                          type: string
                        description: A list of emails that will receive the alert(s).
                      allAdmins:
                        type: boolean
                        description: If true, then all network admins will receive emails.
                      snmp:
                        type: boolean
                        description: If true, then an SNMP trap will be sent if there is an SNMP trap server configured for this network.
                      httpServerIds:
                        type: array
                        items:
                          type: string
                        description: A list of HTTP server IDs to send a Webhook to
                    description: The network-wide destinations for all alerts on the network.
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The type of alert
                        enabled:
                          type: boolean
                          description: A boolean depicting if the alert is turned on or off
                        alertDestinations:
                          type: object
                          properties:
                            emails:
                              type: array
                              items:
                                type: string
                              description: A list of emails that will receive information about the alert
                            smsNumbers:
                              type: array
                              items:
                                type: string
                              description: A list of phone numbers that will receive text messages about the alert. Only available for sensors status alerts.
                            allAdmins:
                              type: boolean
                              description: If true, then all network admins will receive emails for this alert
                            snmp:
                              type: boolean
                              description: If true, then an SNMP trap will be sent for this alert if there is an SNMP trap server configured for this network
                            httpServerIds:
                              type: array
                              items:
                                type: string
                              description: A list of HTTP server IDs to send a Webhook to for this alert
                          description: A hash of destinations for this specific alert
                        filters:
                          type: object
                          properties:
                            conditions:
                              type: array
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    description: Type of condition
                                  unit:
                                    type:
                                    - string
                                    - 'null'
                                    description: Unit
                                  duration:
                                    type: integer
                                    description: Duration
                                  direction:
                                    type: string
                                    enum:
                                    - +
                                    - '-'
                                    description: Direction
                                  threshold:
                                    type: number
                                    format: float
                                    description: Threshold
                              description: Conditions
                            failureType:
                              type: string
                              description: Failure Type
                            lookbackWindow:
                              type: integer
                              description: Loopback Window (in sec)
                            minDuration:
                              type: integer
                              description: Min Duration
                            name:
                              type: string
                              description: Name
                            period:
                              type: integer
                              description: Period
                            priority:
                              type: string
                              description: Priority
                            regex:
                              type: string
                              description: Regex
                            selector:
                              type: string
                              description: Selector
                            serials:
                              type: array
                              items:
                                type: string
                              description: Serials
                            ssidNum:
                              type: integer
                              description: SSID Number
                            tag:
                              type: string
                              description: Tag
                            threshold:
                              type: integer
                              description: Threshold
                            timeout:
                              type: integer
                              description: Timeout
                          description: A hash of specific configuration data for the alert. Only filters specific to the alert will be updated.
                      required:
                      - type
                    description: Alert-specific configuration for each type. Only alerts that pertain to the network can be updated.
                  muting:
                    type: object
                    properties:
                      byPortSchedules:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            description: If true, then wireless unreachable alerts will be muted when caused by a port schedule
                        description: Mute wireless unreachable alerts based on switch port schedules
                    description: Mute alerts under certain conditions
              example:
                defaultDestinations:
                  emails:
                  - miles@meraki.com
                  allAdmins: true
                  snmp: true
                  httpServerIds:
                  - aHR0cHM6Ly93d3cuZXhhbXBsZS5jb20vd2ViaG9va3M=
                alerts:
                - type: gatewayDown
                  enabled: true
                  alertDestinations:
                    emails:
                    - miles@meraki.com
                    smsNumbers:
                    - '+15555555555'
                    allAdmins: false
                    snmp: false
                    httpServerIds:
                    - aHR0cHM6Ly93d3cuZXhhbXBsZS5jb20vd2ViaG9va3M=
                  filters:
                    conditions:
                    - type: temperature
                      unit: celsius
                      duration: 0
                      direction: +
                      threshold: 72.5
                    failureType: 802.1X auth fail
                    lookbackWindow: 360
                    minDuration: 60
                    name: Filter
                    period: 1800
                    priority: ''
                    regex: '[a-z]'
                    selector: '{"smartSensitivity":"medium","smartEnabled":false,"eventReminderPeriodSecs":10800}'
                    serials:
                    - Q234-ABCD-0001
                    - Q234-ABCD-0002
                    - Q234-ABCD-0003
                    ssidNum: 1
                    tag: tag1
                    threshold: 30
                    timeout: 60
                muting:
                  byPortSchedules:
                    enabled: true
      security:
      - oauth2:
        - dashboard:general:telemetry:read
      summary: Return the alert configuration for this network
      tags:
      - networks
