            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Webhook delivery identifier
                  url:
                    type: string
                    description: URL where the webhook was delivered
                  status:
                    type: string
                    enum:
                    - abandoned
                    - delivered
                    - enqueued
                    - processing
                    - retrying
                    description: Current status of the webhook delivery
