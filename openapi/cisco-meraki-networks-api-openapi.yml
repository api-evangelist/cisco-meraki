security:
- meraki_api_key: []
- bearerAuth: []
tags:
- name: networks
paths:
  /networks/{networkId}:
    get:
      description: Return a network
      operationId: getNetwork
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Network ID
                  organizationId:
                    type: string
                    description: Organization ID
                  name:
                    type: string
                    description: Network name
                  productTypes:
                    type: array
                    items:
                      type: string
                    description: List of the product types that the network supports
                  timeZone:
                    type: string
                    description: Timezone of the network
                  tags:
                    type: array
                    items:
                      type: string
                    description: Network tags
                  enrollmentString:
                    type: string
                    description: Enrollment string for the network
                  url:
                    type: string
                    description: URL to the network Dashboard UI
                  notes:
                    type: string
                    description: Notes for the network
                  isBoundToConfigTemplate:
                    type: boolean
                    description: If the network is bound to a config template
              example:
                id: N_24329156
                organizationId: '2930418'
                name: Main Office
                productTypes:
                - appliance
                - switch
                - wireless
                timeZone: America/Los_Angeles
                tags:
                - tag1
                - tag2
                enrollmentString: my-enrollment-string
                url: https://n1.meraki.com//n//manage/nodes/list
                notes: Additional description of the network
                isBoundToConfigTemplate: false
      security:
      - oauth2:
        - dashboard:general:config:read
      summary: Return a network
      tags:
      - networks
    put:
      description: Update a network
      operationId: updateNetwork
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the network
                timeZone:
                  type: string
                  description: The timezone of the network. For a list of allowed timezones, please see the 'TZ' column in the table in <a target='_blank' href='https://en.wikipedia.org/wiki/List_of_tz_database_time_zones'>this article.</a>
                tags:
                  type: array
                  items:
                    type: string
                  description: A list of tags to be applied to the network
                enrollmentString:
                  type: string
                  description: A unique identifier which can be used for device enrollment or easy access through the Meraki SM Registration page or the Self Service Portal. Please note that changing this field may cause existing bookmarks to break.
                notes:
                  type:
                  - string
                  - 'null'
                  description: Add any notes or additional information about this network here.
              example:
                name: Main Office
                timeZone: America/Los_Angeles
                tags:
                - tag1
                - tag2
                enrollmentString: my-enrollment-string
                notes: Additional description of the network
        required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Network ID
                  organizationId:
                    type: string
                    description: Organization ID
                  name:
                    type: string
                    description: Network name
                  productTypes:
                    type: array
                    items:
                      type: string
                    description: List of the product types that the network supports
                  timeZone:
                    type: string
                    description: Timezone of the network
                  tags:
                    type: array
                    items:
                      type: string
                    description: Network tags
                  enrollmentString:
                    type: string
                    description: Enrollment string for the network
                  url:
                    type: string
                    description: URL to the network Dashboard UI
                  notes:
                    type: string
                    description: Notes for the network
                  isBoundToConfigTemplate:
                    type: boolean
                    description: If the network is bound to a config template
              example:
                id: N_24329156
                organizationId: '2930418'
                name: Main Office
                productTypes:
                - appliance
                - switch
                - wireless
                timeZone: America/Los_Angeles
                tags:
                - tag1
                - tag2
                enrollmentString: my-enrollment-string
                url: https://n1.meraki.com//n//manage/nodes/list
                notes: Additional description of the network
                isBoundToConfigTemplate: false
      security:
      - oauth2:
        - dashboard:general:config:write
      summary: Update a network
      tags:
      - networks
    delete:
      description: Delete a network
      operationId: deleteNetwork
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      responses:
        '204':
          description: Successful operation
      security:
      - oauth2:
        - dashboard:general:config:write
      summary: Delete a network
      tags:
      - networks
  /networks/{networkId}/alerts/history:
    get:
      description: Return the alert history for this network
      operationId: getNetworkAlertsHistory
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      - name: perPage
        in: query
        description: The number of entries per page returned. Acceptable range is 3 - 1000. Default is 100.
        schema:
          type: integer
      - name: startingAfter
        in: query
        description: A token used by the server to indicate the start of the page. Often this is a timestamp or an ID but it is not limited to those. This parameter should not be defined by client applications. The link for the first, last, prev, or next page in the HTTP Link header should define it.
        schema:
          type: string
      - name: endingBefore
        in: query
        description: A token used by the server to indicate the end of the page. Often this is a timestamp or an ID but it is not limited to those. This parameter should not be defined by client applications. The link for the first, last, prev, or next page in the HTTP Link header should define it.
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    occurredAt:
                      type: string
                      description: time when the event occurred
                    alertTypeId:
                      type: string
                      description: type of alert
                    alertType:
                      type: string
                      description: user friendly alert type
                    device:
                      type: object
                      properties:
                        serial:
                          type: string
                          description: device serial
                      description: info related to the device that caused the alert
                    destinations:
                      type: object
                      properties:
                        email:
                          type: object
                          properties:
                            sentAt:
                              type: string
                              description: time when the alert was sent to the user(s) for this channel
                          description: email destinations for this alert
                        push:
                          type: object
                          properties:
                            sentAt:
                              type: string
                              description: time when the alert was sent to the user(s) for this channel
                          description: push destinations for this alert
                        sms:
                          type: object
                          properties:
                            sentAt:
                              type: string
                              description: time when the alert was sent to the user(s) for this channel
                          description: sms destinations for this alert
                        webhook:
                          type: object
                          properties:
                            sentAt:
                              type: string
                              description: time when the alert was sent to the user(s) for this channel
                          description: webhook destinations for this alert
                      description: the destinations this alert is configured to be delivered to
                    alertData:
                      type: object
                      description: relevant data about the event that caused the alert
              example:
              - occurredAt: '2022-07-11T22:35:34Z'
                alertTypeId: settings_changed
                alertType: Settings changed
                device:
                  serial: Q3CG-G6W8-BEVR
                destinations:
                  email:
                    sentAt: '2022-07-11T22:40:34Z'
                  push:
                    sentAt: '2022-07-11T22:40:34Z'
                  sms:
                    sentAt: '2022-07-11T22:40:34Z'
                  webhook:
                    sentAt: '2022-07-11T22:40:34Z'
          headers:
            Link:
              schema:
                type: string
              description: A comma-separated list of first, last, prev, and next relative links used for subsequent paginated requests.
      security:
      - oauth2:
        - dashboard:general:telemetry:read
      summary: Return the alert history for this network
      tags:
      - networks
