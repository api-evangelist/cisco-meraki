  /networks/{networkId}/traffic:
    get:
      description: Return the traffic analysis data for this network. Traffic analysis with hostname visibility must be enabled on the network.
      operationId: getNetworkTraffic
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      - name: t0
        in: query
        description: The beginning of the timespan for the data. The maximum lookback period is 30 days from today.
        schema:
          type: string
      - name: timespan
        in: query
        description: The timespan for which the information will be fetched. If specifying timespan, do not specify parameter t0. The value must be in seconds and be less than or equal to 30 days.
        schema:
          type: number
          format: float
          maximum: 2592000
      - name: deviceType
        in: query
        description: 'Filter the data by device type: ''combined'', ''wireless'', ''switch'' or ''appliance''. Defaults to ''combined''. When using ''combined'', for each rule the data will come from the device type with the most usage.'
        schema:
          type: string
          enum:
          - appliance
          - combined
          - switch
          - wireless
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    application:
                      type: string
                      description: Traffic application
                    destination:
                      type: string
                      description: Traffic destination
                    protocol:
                      type: string
                      description: Traffic protocol
                    port:
                      type: integer
                      description: Traffic port
                    sent:
                      type: number
                      format: float
                      description: Traffic sent in kb
                    recv:
                      type: number
                      format: float
                      description: Traffic received in kb
                    numClients:
                      type: integer
                      description: Number of clients with traffic
                    activeTime:
                      type: integer
                      description: Active time with traffic
                    flows:
                      type: integer
                      description: Number of traffic flows
              example:
              - application: Gmail
                destination: 2.3.4.5
                protocol: TCP
                port: 443
                sent: 138.0
                recv: 61.0
                numClients: 7
                activeTime: 77000
                flows: 300
      security:
      - oauth2:
        - dashboard:general:telemetry:read
      summary: Return the traffic analysis data for this network
      tags:
      - networks
