  /networks/{networkId}/firmwareUpgrades/rollbacks:
    post:
      description: Rollback a Firmware Upgrade For A Network
      operationId: createNetworkFirmwareUpgradesRollback
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: string
                  enum:
                  - appliance
                  - camera
                  - campusGateway
                  - cellularGateway
                  - secureConnect
                  - switch
                  - switchCatalyst
                  - wireless
                  - wirelessController
                  description: Product type to rollback (if the network is a combined network)
                time:
                  type: string
                  format: date-time
                  description: Scheduled time for the rollback
                reasons:
                  type: array
                  items:
                    type: object
                    properties:
                      category:
                        type: string
                        enum:
                        - broke old features
                        - other
                        - performance
                        - stability
                        - testing
                        - unifying networks versions
                        description: Reason for the rollback
                      comment:
                        type: string
                        description: Additional comment about the rollback
                    required:
                    - category
                    - comment
                  description: Reasons for the rollback
                toVersion:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The version ID
                  description: Version to downgrade to (if the network has firmware flexibility)
                predownload:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Whether or not the network devices will predownload the firmware image in advance of the actual upgrade. Only applies to wireless devices running MR 32 or higher.
                  description: Predownload settings for the firmware upgrade
              example:
                product: switch
                time: '2020-10-21T02:00:00Z'
                reasons:
                - category: performance
                  comment: Network was slower with the upgrade
                toVersion:
                  id: '7857'
                predownload:
                  enabled: false
              required:
              - reasons
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    type: string
                    enum:
                    - appliance
                    - camera
                    - campusGateway
                    - cellularGateway
                    - secureConnect
                    - switch
                    - switchCatalyst
                    - wireless
                    - wirelessController
                    description: Product type to rollback (if the network is a combined network)
                  status:
                    type: string
                    enum:
                    - canceled
                    - completed
                    - in_progress
                    - pending
                    description: Status of the rollback
                  upgradeBatchId:
                    type: string
                    description: Batch ID of the firmware rollback
                  time:
                    type: string
                    format: date-time
                    description: Scheduled time for the rollback
                  toVersion:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Firmware version identifier
                      firmware:
                        type: string
                        description: Name of the firmware version
                      shortName:
                        type: string
                        description: Firmware version short name
                      releaseType:
                        type: string
                        description: Release type of the firmware version
                      releaseDate:
                        type: string
                        format: date-time
                        description: Release date of the firmware version
                    description: Version to downgrade to (if the network has firmware flexibility)
                  reasons:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                          enum:
                          - broke old features
                          - other
                          - performance
                          - stability
                          - testing
                          - unifying networks versions
                          description: Reason for the rollback
                        comment:
                          type: string
                          description: Additional comment about the rollback
                    description: Reasons for the rollback
                  predownload:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Whether or not the network devices will predownload the firmware image in advance of the actual upgrade. Only applies to wireless devices running MR 32 or higher.
                    description: Predownload settings for the firmware upgrade
              example:
                product: switch
                status: pending
                upgradeBatchId: '23456'
                time: '2020-10-21T02:00:00Z'
                toVersion:
                  id: '7857'
                  firmware: switch-15-5-2
                  shortName: MS 25.5.2
                  releaseType: stable
                  releaseDate: '2020-03-28T17:22:52Z'
                reasons:
                - category: performance
                  comment: Network was slower with the upgrade
                predownload:
                  enabled: false
      security:
      - oauth2:
        - dashboard:general:config:write
      summary: Rollback a Firmware Upgrade For A Network
      tags:
      - networks
