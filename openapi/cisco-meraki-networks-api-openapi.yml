  /networks/{networkId}/merakiAuthUsers:
    get:
      description: List the authorized users configured under Meraki Authentication for a network (splash guest or RADIUS users for a wireless network, or client VPN users for a MX network)
      operationId: getNetworkMerakiAuthUsers
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Meraki auth user id
                    email:
                      type: string
                      description: Email address of the user
                    name:
                      type: string
                      description: Name of the user
                    createdAt:
                      type: string
                      format: date-time
                      description: Creation time of the user
                    accountType:
                      type: string
                      description: Authorization type for user.
                    isAdmin:
                      type: boolean
                      description: Whether or not the user is a Dashboard administrator
                    authorizations:
                      type: array
                      items:
                        type: object
                        properties:
                          ssidNumber:
                            type: integer
                            description: SSID number
                          authorizedZone:
                            type: string
                            description: Authorized zone of the user
                          expiresAt:
                            type: string
                            format: date-time
                            description: Authorization expiration time
                          authorizedByName:
                            type: string
                            description: User is authorized by the account name
                          authorizedByEmail:
                            type: string
                            description: User is authorized by the account email address
                      description: User authorization info
              example:
              - id: aGlAaGkuY29t
                email: miles@meraki.com
                name: Miles Meraki
                createdAt: '2018-02-11T00:00:00.090210Z'
                accountType: 802.1X
                isAdmin: false
                authorizations:
                - ssidNumber: 1
                  authorizedZone: Store WiFi
                  expiresAt: '2018-03-13T00:00:00.090210Z'
                  authorizedByName: Miles Meraki
                  authorizedByEmail: miles@meraki.com
      security:
      - oauth2:
        - dashboard:general:config:read
      summary: List the authorized users configured under Meraki Authentication for a network (splash guest or RADIUS users for a wireless network, or client VPN users for a MX network)
      tags:
      - networks
    post:
      description: Authorize a user configured with Meraki Authentication for a network (currently supports 802.1X, splash guest, and client VPN users, and currently, organizations have a 50,000 user cap)
      operationId: createNetworkMerakiAuthUser
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email address of the user
                name:
                  type: string
                  description: Name of the user. Only required If the user is not a Dashboard administrator.
                password:
                  type: string
                  description: The password for this user account. Only required If the user is not a Dashboard administrator.
                accountType:
                  type: string
                  enum:
                  - 802.1X
                  - Client VPN
                  - Guest
                  description: Authorization type for user. Can be 'Guest' or '802.1X' for wireless networks, or 'Client VPN' for MX networks. Defaults to '802.1X'.
                  default: 802.1X
                emailPasswordToUser:
                  type: boolean
                  description: Whether or not Meraki should email the password to user. Default is false.
                isAdmin:
                  type: boolean
                  description: Whether or not the user is a Dashboard administrator.
                authorizations:
                  type: array
                  items:
                    type: object
                    properties:
                      ssidNumber:
                        type: integer
                        description: Required for wireless networks. The SSID for which the user is being authorized, which must be configured for the user's given accountType.
                      expiresAt:
                        type: string
                        description: Date for authorization to expire. Set to 'Never' for the authorization to not expire, which is the default.
                        default: Never
                  description: Authorization zones and expiration dates for the user.
              example:
                email: miles@meraki.com
                name: Miles Meraki
                password: secret
                accountType: 802.1X
                emailPasswordToUser: false
                isAdmin: false
                authorizations:
                - ssidNumber: 1
                  expiresAt: '2018-03-13T00:00:00.090210Z'
              required:
              - email
              - authorizations
        required: true
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Meraki auth user id
                  email:
                    type: string
                    description: Email address of the user
                  name:
                    type: string
                    description: Name of the user
                  createdAt:
                    type: string
                    format: date-time
                    description: Creation time of the user
                  accountType:
                    type: string
                    description: Authorization type for user.
                  isAdmin:
                    type: boolean
                    description: Whether or not the user is a Dashboard administrator
                  authorizations:
                    type: array
                    items:
                      type: object
                      properties:
