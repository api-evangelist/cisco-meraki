                              isRedundancyPort:
                                type: boolean
                                description: Indicate whether the interface is a redundancy port used to perform HA role negotiation
                              linkNegotiation:
                                type: string
                                description: The interface negotiation mode
                              channelGroup:
                                type: object
                                properties:
                                  number:
                                    type: integer
                                    description: The interface channel group number
