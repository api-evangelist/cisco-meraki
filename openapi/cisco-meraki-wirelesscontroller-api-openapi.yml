                              description:
                                type: string
                                description: The description of the wireless LAN controller interface
                              enabled:
                                type: boolean
                                description: The status of the wireless LAN controller interface
                              mac:
                                type: string
                                description: The MAC address of the wireless LAN controller interface
                              status:
                                type: string
                                description: The status of the wireless LAN controller interface
