aid: cisco-meraki
name: Cisco Meraki
description: Cisco Meraki is a cloud-managed networking platform that provides wireless access points, switches,
  security appliances, cameras, sensors, and mobile device management from a single dashboard. The Meraki Dashboard
  API is a RESTful interface for programmatically managing and monitoring Meraki networks at scale, automating organization
  provisioning, device configuration, network operations, and analytics.
